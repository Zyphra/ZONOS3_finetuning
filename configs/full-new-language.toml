# Full-model recipe for a large distribution shift (a new language, 20+ hours of multi-speaker data).
# Longer schedule; own-clip speaker conditioning; validate the languages you keep.
finetune_method = "full"
steps = 3000
batch_size = 4
grad_accum = 4
warmup_steps = 100
lr_scale = 0.02
p_embedding = 0.9
p_reference = 0.0
condition_dropout = 0.2
val_fraction = 0.02
eval_every = 100
qb_update = false
compile = true
export_merged = true
